name: Repo A freeze

on:
  pull_request:
    branches: [ntam-tendies_backend]
  push:
    branches: [ntam-tendies_backend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-a-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-compatibility:
    name: repo-a / api-compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --project backend --locked --group dev
      - name: Check frozen OpenAPI boundary
        run: uv run --project backend python scripts/check_api_freeze.py
      - name: Check migration ownership and history
        run: uv run --project backend python scripts/check_repo_a_migrations.py

  contract-tests:
    name: repo-a / contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked backend dependencies
        run: uv sync --project backend --locked --group dev
      - name: Run auth, provider, route, callback, and privacy contracts
        run: |
          set -euo pipefail
          for test in \
            scripts/test_P4_012_auth.py \
            scripts/test_P4_015_jwks.py \
            scripts/test_085_provider_boundary.py \
            scripts/test_089_snaptrade_client_routes.py \
            scripts/test_090_snaptrade_portfolio.py \
            scripts/test_101_snaptrade_callback_single_processing.py \
            scripts/test_107_broker_account_selection_log_privacy.py \
            scripts/test_108_posthog_disable_sensitive_dom_capture.py \
            scripts/test_111_cross_user_selection_not_found_mapping.py
          do
            uv run --project backend python "$test"
          done

  frontend-contract-build:
    name: repo-a / frontend-contract-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Typecheck frontend contract consumer
        run: pnpm --dir frontend typecheck
      - name: Build frontend contract consumer
        run: pnpm --dir frontend build
