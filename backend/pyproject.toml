[project]
name = "agentic-brokerage-backend"
version = "0.1.0"
description = "Agent-first brokerage MVP backend — FastAPI + Anthropic SDK + Alpaca paper trading"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.45.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    # W6.6 — pin Starlette past PYSEC-2026-161 (pip-audit found 1.0.0 vulnerable;
    # it's transitive via fastapi/sse-starlette, so we constrain it directly).
    "starlette>=1.0.1",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    # 089 — official generated client handles SnapTrade request signing. Keep an
    # exact version until its generated method/response contract is re-verified.
    "snaptrade-python-sdk==12.0.4",
    "alpaca-py>=0.33.0",
    "yfinance>=0.2.50",
    # MCP Python SDK — used by backend/mcp_client.py to host stdio MCP
    # client sessions against external servers (TradingView today, TrueNorth
    # tomorrow). See .proposed_changes/002-tradingview-mcp/README.md §4.7.
    "mcp>=1.0",
    # P4.1 auth — Supabase magic-link JWT verification (backend/auth.py).
    # The `crypto` extra pulls `cryptography`, REQUIRED for ES256/RS256 — the
    # project's Supabase JWTs are signed with asymmetric "JWT Signing Keys"
    # (verified via JWKS). HS256 (legacy) needs no crypto but the extra is
    # harmless. (The 012 "avoid cryptography" rationale no longer applies —
    # asymmetric verification needs it.)
    # W6.6 — floor raised to 2.13.0: pip-audit flagged 2.12.1 for PYSEC-2026-175/
    # 177/178/179. This is the JWT *auth* verification lib (auth.py), so the bump
    # matters. 2.13.0 keeps the same API; re-run scripts/test_P4_012_auth.py +
    # test_P4_015_jwks.py after `uv lock`.
    "pyjwt[crypto]>=2.13.0",
    # P4.2 persistence — Supabase async Postgres client (backend/db.py).
    # Pinned <2.28.0: storage3 2.28+ pulls `pyiceberg` (Apache Iceberg + Arrow
    # stack), which currently fails to build on macOS/py3.14 and is heavy
    # baggage for our use-case. Bump the cap when storage3 decouples the
    # iceberg extra (track supabase-community/storage-py).
    "supabase>=2.10.0,<2.28.0",
    # P4.4 observability — Langfuse traces around the agent loop
    # (backend/observability.py). v4.x is the current line; OTel-based API
    # (`start_as_current_observation`, `propagate_attributes`). Pure-Python.
    # No-ops gracefully when LANGFUSE_PUBLIC_KEY/SECRET aren't set, so the
    # backend boots and serves /api/chat without Langfuse credentials too.
    "langfuse>=4.7.0,<5.0.0",
]

[dependency-groups]
# Optional analytics. Was the `auth` group before P4.1/P4.2 made `supabase`
# a core dep — now just posthog (backend-side event tracking, used at P5).
auth = [
    "posthog>=3.7.0",
]
# P4.3 memory — Mem0 per-user memory (backend/memory.py). Kept OPTIONAL (not a
# main dep) so the default install + Railway image stay lean and the verified
# backend is untouched until memory is explicitly enabled. memory.py
# lazy-imports `mem0` and no-ops when MEM0_API_KEY is unset OR the package isn't
# installed, so the backend boots either way. Enable with:
#     uv sync --group memory     (then set a real MEM0_API_KEY)
# Pinned to the v3-client line (>=2.0,<3.0) — VERIFIED against the installed
# mem0ai 2.0.4. This matters for correctness, not just stability: the 2.x v3
# client's `AsyncMemoryClient.search()` scopes by `filters={"user_id": …}` and
# `top_k`, and REJECTS a top-level `user_id=` kwarg (ENTITY_PARAMS guard) —
# `memory.py` is written to that contract. An older 0.x or a future 3.x could
# change the call shape and silently break recall (it fails closed). Re-verify
# `memory.py`'s search/add call shapes before widening this pin.
# Image-weight note (revisit at P6 deploy): base `mem0ai` pulls moderately heavy
# transitive deps (e.g. openai) the hosted-platform path doesn't use
# client-side; pure-Python, installs cleanly (no pyiceberg-style build break).
memory = [
    "mem0ai>=2.0.0,<3.0.0",
]
# W3 (pivot) — WhatsApp delivery of the daily briefing via Twilio (backend/whatsapp.py).
# OPTIONAL like `memory`: whatsapp.py lazy-imports `twilio` only on the real-send
# path and LOGS instead (mock mode) when USE_MOCK_WHATSAPP=1 or creds are absent,
# so the default install / chat backend boots without it. Enable real sends with:
#     uv sync --group whatsapp     (then set TWILIO_* in .env, USE_MOCK_WHATSAPP unset)
# The send is system-side (the W5 cron), NEVER an agent tool (SECURITY threat 1).
whatsapp = [
    "twilio>=9.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
