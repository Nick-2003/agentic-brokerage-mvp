[project]
name = "agentic-brokerage-backend"
version = "0.1.0"
description = "Agent-first brokerage MVP backend — FastAPI + Anthropic SDK + Alpaca paper trading"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.45.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "alpaca-py>=0.33.0",
    "yfinance>=0.2.50",
    # MCP Python SDK — used by backend/mcp_client.py to host stdio MCP
    # client sessions against external servers (TradingView today, TrueNorth
    # tomorrow). See proposed_changes/002-tradingview-mcp/README.md §4.7.
    "mcp>=1.0",
    # P4.1 auth — offline HS256 verification of Supabase magic-link JWTs
    # (backend/auth.py). Pure-Python for HS256; does NOT pull `cryptography`.
    # The heavier supabase client stays in the `auth` group (needed at P4.2).
    "pyjwt>=2.9.0",
]

[dependency-groups]
# `auth` group — Supabase + PostHog. The Supabase Python client is NOT needed
# for P4.1 (JWT verification is offline via PyJWT above); it lands with P4.2
# persistence (backend/db.py). Kept out of the default sync so the backend
# installs without pulling `cryptography`. Install with: uv sync --group auth
auth = [
    "supabase>=2.10.0",
    "posthog>=3.7.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
